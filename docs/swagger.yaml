basePath: /
definitions:
  model.Chat:
    properties:
      address:
        example: 0xchat123
        type: string
      created_at:
        type: string
      language:
        example: en
        type: string
      phase:
        example: networking
        type: string
      phase_started_at:
        type: string
      room:
        example: 0xroom123
        type: string
      scenario:
        example: ai-future
        type: string
    type: object
  model.Handshake:
    properties:
      created_at:
        type: string
      from_address:
        example: 0xuser123
        type: string
      room:
        example: 0xroom123
        type: string
      status:
        example: 1
        type: integer
      to_address:
        example: 0xuser456
        type: string
      tx_id:
        example: 0xtx42
        type: string
      value:
        example: 1
        type: integer
    type: object
  model.Message:
    properties:
      chat:
        example: 0xchat123
        type: string
      content:
        example: hello there
        type: string
      created_at:
        type: string
      from:
        example: 0xuser123
        type: string
      to:
        example: 0xuser456
        type: string
      tx_id:
        example: 0x9f1c0d...
        type: string
    type: object
  model.Participant:
    properties:
      chat:
        example: 0xchat123
        type: string
      user:
        example: 0xuser123
        type: string
    type: object
  model.Room:
    properties:
      address:
        example: 0xroom123
        type: string
      created_at:
        type: string
      deleted_at:
        type: string
      description:
        example: A room for bleak meetings
        type: string
      max_user:
        example: 100
        type: integer
      name:
        example: Meta Room
        type: string
      updated_at:
        type: string
    type: object
  model.User:
    properties:
      address:
        example: 0xuser123
        type: string
      created_at:
        type: string
      deleted_at:
        type: string
      greeting:
        example: Hi, I'm Alice — I paint watercolor postcards.
        type: string
      name:
        example: Alice
        type: string
      private_bio:
        example: real me
        type: string
      public_bio:
        example: public hello
        type: string
      room:
        example: 0xroom123
        type: string
      updated_at:
        type: string
    type: object
  server.ChatResponse:
    properties:
      address:
        example: 0xchat123
        type: string
      created_at:
        type: string
      language:
        example: en
        type: string
      participants:
        items:
          $ref: '#/definitions/model.Participant'
        type: array
      phase:
        example: networking
        type: string
      phase_started_at:
        type: string
      room:
        example: 0xroom123
        type: string
      scenario:
        example: ai-future
        type: string
    type: object
  server.ClearChatResponse:
    properties:
      chat:
        type: string
      cleared:
        type: integer
    type: object
  server.CreateHandshakeRequest:
    properties:
      from_address:
        type: string
      status:
        type: integer
      to_address:
        type: string
    type: object
  server.CreateRoomRequest:
    properties:
      description:
        type: string
      name:
        type: string
    type: object
  server.CreateUserRequest:
    properties:
      language:
        description: 'Language of the generated greeting: "en" (default) or "ru".'
        type: string
      name:
        type: string
      private_bio:
        type: string
      public_bio:
        type: string
    type: object
  server.GreetingResponse:
    properties:
      address:
        type: string
      greeting:
        type: string
    type: object
  server.KickoffResponse:
    properties:
      chat:
        type: string
      cleared:
        type: integer
      speaker:
        type: string
    type: object
  server.PutUserGreetingRequest:
    properties:
      greeting:
        type: string
    type: object
  server.SendMessageRequest:
    properties:
      content:
        type: string
      from:
        type: string
      to:
        type: string
    type: object
  server.SetChatLanguageRequest:
    properties:
      language:
        type: string
    type: object
  server.UpdateRoomRequest:
    properties:
      description:
        type: string
      name:
        type: string
    type: object
  server.UpdateUserRequest:
    properties:
      name:
        type: string
      private_bio:
        type: string
      public_bio:
        type: string
    type: object
info:
  contact:
    name: extube
    url: https://github.com/extube
  description: 'REST API for bleak-node: rooms, room users and handshakes, backed
    by SQLite.'
  title: bleak-node API
  version: 0.1.0
paths:
  /api/chat/{address}:
    get:
      description: Returns one chat together with its participants.
      parameters:
      - description: Chat address
        in: path
        name: address
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.ChatResponse'
        "404":
          description: Not Found
          schema:
            type: string
      summary: get chat
      tags:
      - chats
  /api/chat/{address}/kickoff:
    post:
      description: Clears the message history of the chat and returns the interaction
        to the queue. The speaker of the first turn is the user who sent the pair's
        earliest handshake; the agents then continue automatically until the chat
        limit.
      parameters:
      - description: Chat address
        in: path
        name: address
        required: true
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/server.KickoffResponse'
        "404":
          description: Not Found
          schema:
            type: string
      summary: kick off chat
      tags:
      - chats
  /api/chat/{address}/language:
    patch:
      consumes:
      - application/json
      description: Sets the language used for generated chat prompts and messages.
        Supported values are en and ru.
      parameters:
      - description: Chat address
        in: path
        name: address
        required: true
        type: string
      - description: Chat language
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/server.SetChatLanguageRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.Chat'
        "400":
          description: Bad Request
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
      summary: set chat language
      tags:
      - chats
  /api/chat/{address}/message:
    delete:
      description: Deletes every message of the chat. The chat and its participants
        remain.
      parameters:
      - description: Chat address
        in: path
        name: address
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.ClearChatResponse'
        "404":
          description: Not Found
          schema:
            type: string
      summary: clear chat history
      tags:
      - chats
    get:
      description: Returns every message in the chat, oldest first.
      parameters:
      - description: Chat address
        in: path
        name: address
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.Message'
            type: array
        "404":
          description: Not Found
          schema:
            type: string
      summary: list messages of a chat
      tags:
      - messages
  /api/handshake:
    post:
      consumes:
      - application/json
      description: 'Registers a handshake between two existing users with a server-generated
        tx id. Both users must live in the same room (the handshake is tied to it).
        Status must be in {1,2,3,4}; the sender''s room-scoped income must exceed
        its outcome. A directed pair (from, to) is unique: if that handshake already
        exists nothing is created and the live handshake is returned with 200 instead
        of 201. A repeat request for a pair without a live chat (deleted) re-creates
        the chat.'
      parameters:
      - description: Handshake to create
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/server.CreateHandshakeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.Handshake'
        "201":
          description: Created
          schema:
            $ref: '#/definitions/model.Handshake'
        "400":
          description: Bad Request
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
        "409":
          description: Conflict
          schema:
            type: string
      summary: create handshake
      tags:
      - handshakes
  /api/handshake/user/{address}:
    get:
      description: Returns every handshake where the user is the sender or the receiver,
        newest first.
      parameters:
      - description: User address
        in: path
        name: address
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.Handshake'
            type: array
      summary: list handshakes of a user
      tags:
      - handshakes
  /api/message:
    post:
      consumes:
      - application/json
      description: 'Posts a message from one user to another inside their chat. The
        chat must exist: it is created automatically once handshakes exist in both
        directions (A -> B and B -> A) between the two users. Content is limited to
        255 symbols, the tx id and created_at are generated by the server.'
      parameters:
      - description: Message to send
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/server.SendMessageRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/model.Message'
        "400":
          description: Bad Request
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
        "409":
          description: Conflict
          schema:
            type: string
      summary: send message
      tags:
      - messages
  /api/room:
    get:
      description: Returns all non-deleted rooms.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.Room'
            type: array
      summary: list rooms
      tags:
      - rooms
    post:
      consumes:
      - application/json
      description: Creates a room with a server-generated unique address.
      parameters:
      - description: Room to create
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/server.CreateRoomRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/model.Room'
        "400":
          description: Bad Request
          schema:
            type: string
        "409":
          description: Conflict
          schema:
            type: string
      summary: create room
      tags:
      - rooms
  /api/room/{address}:
    delete:
      description: Soft-deletes a room together with its linked users.
      parameters:
      - description: Room address
        in: path
        name: address
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.Room'
        "404":
          description: Not Found
          schema:
            type: string
      summary: delete room
      tags:
      - rooms
    get:
      description: Returns a non-deleted room by its address.
      parameters:
      - description: Room address
        in: path
        name: address
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.Room'
        "404":
          description: Not Found
          schema:
            type: string
      summary: get room
      tags:
      - rooms
    put:
      consumes:
      - application/json
      description: Updates name and/or description of a room. Omitted fields keep
        their value.
      parameters:
      - description: Room address
        in: path
        name: address
        required: true
        type: string
      - description: Fields to update
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/server.UpdateRoomRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.Room'
        "400":
          description: Bad Request
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
      summary: update room
      tags:
      - rooms
  /api/room/{room}/user:
    get:
      description: Returns all non-deleted users linked to the room.
      parameters:
      - description: Room address
        in: path
        name: room
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.User'
            type: array
      summary: list users of a room
      tags:
      - users
    post:
      consumes:
      - application/json
      description: Creates a user linked to the room. The room must exist and not
        be deleted.
      parameters:
      - description: Room address
        in: path
        name: room
        required: true
        type: string
      - description: User to create
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/server.CreateUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/model.User'
        "400":
          description: Bad Request
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
        "409":
          description: Conflict
          schema:
            type: string
      summary: create user in room
      tags:
      - users
  /api/room/{room}/user/{address}:
    delete:
      description: Soft-deletes a user of the room.
      parameters:
      - description: Room address
        in: path
        name: room
        required: true
        type: string
      - description: User address
        in: path
        name: address
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.User'
        "404":
          description: Not Found
          schema:
            type: string
      summary: delete user
      tags:
      - users
    get:
      description: Returns a non-deleted user linked to the room.
      parameters:
      - description: Room address
        in: path
        name: room
        required: true
        type: string
      - description: User address
        in: path
        name: address
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.User'
        "404":
          description: Not Found
          schema:
            type: string
      summary: get user
      tags:
      - users
    put:
      consumes:
      - application/json
      description: Updates name and/or bios of a user. Omitted fields keep their value.
      parameters:
      - description: Room address
        in: path
        name: room
        required: true
        type: string
      - description: User address
        in: path
        name: address
        required: true
        type: string
      - description: Fields to update
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/server.UpdateUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.User'
        "400":
          description: Bad Request
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
      summary: update user
      tags:
      - users
  /api/room/{room}/user/{address}/chat:
    get:
      description: Returns every chat the user participates in. The user must live
        in the given room.
      parameters:
      - description: Room address
        in: path
        name: room
        required: true
        type: string
      - description: User address
        in: path
        name: address
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/server.ChatResponse'
            type: array
        "404":
          description: Not Found
          schema:
            type: string
      summary: list chats of a room user
      tags:
      - chats
  /api/room/{room}/user/{address}/chat/{chat}/messages:
    get:
      description: Returns every message of the chat, oldest first. The user must
        live in the given room and participate in the chat.
      parameters:
      - description: Room address
        in: path
        name: room
        required: true
        type: string
      - description: User address
        in: path
        name: address
        required: true
        type: string
      - description: Chat address
        in: path
        name: chat
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.Message'
            type: array
        "404":
          description: Not Found
          schema:
            type: string
      summary: list messages of a room user chat
      tags:
      - messages
  /api/room/{room}/user/{address}/greeting:
    get:
      description: Returns the greeting (hello) message of a non-deleted user.
      parameters:
      - description: Room address
        in: path
        name: room
        required: true
        type: string
      - description: User address
        in: path
        name: address
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.GreetingResponse'
        "404":
          description: Not Found
          schema:
            type: string
      summary: get user greeting
      tags:
      - users
    put:
      consumes:
      - application/json
      description: 'Stores the greeting (hello) message of a non-deleted user. The
        greeting must be non-empty and must not contain questions: it opens every
        new chat of the user.'
      parameters:
      - description: Room address
        in: path
        name: room
        required: true
        type: string
      - description: User address
        in: path
        name: address
        required: true
        type: string
      - description: Greeting to set
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/server.PutUserGreetingRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.GreetingResponse'
        "400":
          description: Bad Request
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
      summary: set user greeting
      tags:
      - users
  /api/room/{room}/user/{address}/greeting/regenerate:
    post:
      description: Re-generates the greeting (hello) message of a non-deleted user
        from their bios. The optional language query parameter selects "en" (default)
        or "ru".
      parameters:
      - description: Room address
        in: path
        name: room
        required: true
        type: string
      - description: User address
        in: path
        name: address
        required: true
        type: string
      - description: 'Greeting language: en (default) or ru'
        in: query
        name: language
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.GreetingResponse'
        "400":
          description: Bad Request
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
      summary: regenerate user greeting
      tags:
      - users
  /api/user/{address}/chat:
    get:
      description: Returns every chat the user participates in, newest first.
      parameters:
      - description: User address
        in: path
        name: address
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/server.ChatResponse'
            type: array
      summary: list chats of a user
      tags:
      - chats
swagger: "2.0"
