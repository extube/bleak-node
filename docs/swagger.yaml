basePath: /
definitions:
  model.Handshake:
    properties:
      created_at:
        type: string
      from_address:
        example: 0xuser123
        type: string
      status:
        example: 1
        type: integer
      to_address:
        example: 0xuser456
        type: string
      tx_id:
        example: 0xtx42
        type: string
      value:
        example: 1
        type: integer
    type: object
  model.Room:
    properties:
      address:
        example: 0xroom123
        type: string
      created_at:
        type: string
      deleted_at:
        type: string
      description:
        example: A room for bleak meetings
        type: string
      max_user:
        example: 100
        type: integer
      name:
        example: Meta Room
        type: string
      updated_at:
        type: string
    type: object
  model.User:
    properties:
      address:
        example: 0xuser123
        type: string
      created_at:
        type: string
      deleted_at:
        type: string
      name:
        example: Alice
        type: string
      private_bio:
        example: real me
        type: string
      public_bio:
        example: public hello
        type: string
      room:
        example: 0xroom123
        type: string
      updated_at:
        type: string
    type: object
  server.CreateHandshakeRequest:
    properties:
      from_address:
        type: string
      status:
        type: integer
      to_address:
        type: string
    type: object
  server.CreateRoomRequest:
    properties:
      description:
        type: string
      name:
        type: string
    type: object
  server.CreateUserRequest:
    properties:
      name:
        type: string
      private_bio:
        type: string
      public_bio:
        type: string
    type: object
  server.UpdateRoomRequest:
    properties:
      description:
        type: string
      name:
        type: string
    type: object
  server.UpdateUserRequest:
    properties:
      name:
        type: string
      private_bio:
        type: string
      public_bio:
        type: string
    type: object
info:
  contact:
    name: extube
    url: https://github.com/extube
  description: 'REST API for bleak-node: rooms, room users and handshakes, backed
    by SQLite.'
  title: bleak-node API
  version: 0.1.0
paths:
  /api/handshake:
    post:
      consumes:
      - application/json
      description: Registers a handshake between two existing users with a server-generated
        tx id. Status must be in {1,2,3,4}; the sender's income must exceed its outcome.
      parameters:
      - description: Handshake to create
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/server.CreateHandshakeRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/model.Handshake'
        "400":
          description: Bad Request
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
        "409":
          description: Conflict
          schema:
            type: string
      summary: create handshake
      tags:
      - handshakes
  /api/handshake/user/{address}:
    get:
      description: Returns every handshake where the user is the sender or the receiver,
        newest first.
      parameters:
      - description: User address
        in: path
        name: address
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.Handshake'
            type: array
      summary: list handshakes of a user
      tags:
      - handshakes
  /api/room:
    get:
      description: Returns all non-deleted rooms.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.Room'
            type: array
      summary: list rooms
      tags:
      - rooms
    post:
      consumes:
      - application/json
      description: Creates a room with a server-generated unique address.
      parameters:
      - description: Room to create
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/server.CreateRoomRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/model.Room'
        "400":
          description: Bad Request
          schema:
            type: string
        "409":
          description: Conflict
          schema:
            type: string
      summary: create room
      tags:
      - rooms
  /api/room/{address}:
    delete:
      description: Soft-deletes a room together with its linked users.
      parameters:
      - description: Room address
        in: path
        name: address
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.Room'
        "404":
          description: Not Found
          schema:
            type: string
      summary: delete room
      tags:
      - rooms
    get:
      description: Returns a non-deleted room by its address.
      parameters:
      - description: Room address
        in: path
        name: address
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.Room'
        "404":
          description: Not Found
          schema:
            type: string
      summary: get room
      tags:
      - rooms
    put:
      consumes:
      - application/json
      description: Updates name and/or description of a room. Omitted fields keep
        their value.
      parameters:
      - description: Room address
        in: path
        name: address
        required: true
        type: string
      - description: Fields to update
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/server.UpdateRoomRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.Room'
        "400":
          description: Bad Request
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
      summary: update room
      tags:
      - rooms
  /api/room/{room}/user:
    get:
      description: Returns all non-deleted users linked to the room.
      parameters:
      - description: Room address
        in: path
        name: room
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.User'
            type: array
      summary: list users of a room
      tags:
      - users
    post:
      consumes:
      - application/json
      description: Creates a user linked to the room. The room must exist and not
        be deleted.
      parameters:
      - description: Room address
        in: path
        name: room
        required: true
        type: string
      - description: User to create
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/server.CreateUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/model.User'
        "400":
          description: Bad Request
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
        "409":
          description: Conflict
          schema:
            type: string
      summary: create user in room
      tags:
      - users
  /api/room/{room}/user/{address}:
    delete:
      description: Soft-deletes a user of the room.
      parameters:
      - description: Room address
        in: path
        name: room
        required: true
        type: string
      - description: User address
        in: path
        name: address
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.User'
        "404":
          description: Not Found
          schema:
            type: string
      summary: delete user
      tags:
      - users
    get:
      description: Returns a non-deleted user linked to the room.
      parameters:
      - description: Room address
        in: path
        name: room
        required: true
        type: string
      - description: User address
        in: path
        name: address
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.User'
        "404":
          description: Not Found
          schema:
            type: string
      summary: get user
      tags:
      - users
    put:
      consumes:
      - application/json
      description: Updates name and/or bios of a user. Omitted fields keep their value.
      parameters:
      - description: Room address
        in: path
        name: room
        required: true
        type: string
      - description: User address
        in: path
        name: address
        required: true
        type: string
      - description: Fields to update
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/server.UpdateUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.User'
        "400":
          description: Bad Request
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
      summary: update user
      tags:
      - users
swagger: "2.0"
