basePath: /
definitions:
  model.Chat:
    properties:
      address:
        example: 0xchat123
        type: string
      created_at:
        type: string
      language:
        example: en
        type: string
      phase:
        example: networking
        type: string
      phase_started_at:
        type: string
      room:
        example: 0xroom123
        type: string
      scenario:
        example: ai-future
        type: string
    type: object
  model.Handshake:
    properties:
      created_at:
        type: string
      from_address:
        example: 0xuser123
        type: string
      room:
        example: 0xroom123
        type: string
      status:
        example: 1
        type: integer
      to_address:
        example: 0xuser456
        type: string
      tx_id:
        example: 0xtx42
        type: string
      value:
        example: 1
        type: integer
    type: object
  model.Message:
    properties:
      chat:
        example: 0xchat123
        type: string
      content:
        example: hello there
        type: string
      created_at:
        type: string
      from:
        example: 0xuser123
        type: string
      to:
        example: 0xuser456
        type: string
      tx_id:
        example: 0x9f1c0d...
        type: string
    type: object
  model.Participant:
    properties:
      chat:
        example: 0xchat123
        type: string
      user:
        example: 0xuser123
        type: string
    type: object
  model.Room:
    properties:
      address:
        example: 0xroom123
        type: string
      created_at:
        type: string
      deleted_at:
        type: string
      description:
        example: A room for bleak meetings
        type: string
      language:
        example: en
        type: string
      max_user:
        example: 100
        type: integer
      name:
        example: Meta Room
        type: string
      updated_at:
        type: string
    type: object
  model.User:
    properties:
      address:
        example: 0xuser123
        type: string
      created_at:
        type: string
      deleted_at:
        type: string
      greeting:
        example: Hi, I'm Alice — I paint watercolor postcards.
        type: string
      language:
        example: en
        type: string
      mutual_code_live:
        description: |-
          MutualCodeLive reports whether a one-time mutual code is registered
          for the persona (derived from the stored hash, never stored itself).
          It is set ONLY on token-authenticated reads of the persona; public
          reads leave it nil.
        example: true
        type: boolean
      name:
        example: Alice
        type: string
      private_bio:
        example: real me
        type: string
      public_bio:
        example: public hello
        type: string
      room:
        example: 0xroom123
        type: string
      updated_at:
        type: string
    type: object
  server.ChatResponse:
    properties:
      address:
        example: 0xchat123
        type: string
      created_at:
        type: string
      language:
        example: en
        type: string
      participants:
        items:
          $ref: '#/definitions/model.Participant'
        type: array
      phase:
        example: networking
        type: string
      phase_started_at:
        type: string
      room:
        example: 0xroom123
        type: string
      scenario:
        example: ai-future
        type: string
    type: object
  server.ClearChatResponse:
    properties:
      chat:
        type: string
      cleared:
        type: integer
    type: object
  server.CreateHandshakeRequest:
    properties:
      from_address:
        type: string
      status:
        type: integer
      to_address:
        type: string
    type: object
  server.CreateInviteRequest:
    properties:
      expires_at:
        type: string
    type: object
  server.CreateMutualHandshakeRequest:
    properties:
      mutual_code:
        type: string
      user_address:
        type: string
    type: object
  server.CreateRoomRequest:
    properties:
      description:
        type: string
      language:
        type: string
      name:
        type: string
      token:
        type: string
    type: object
  server.CreateRoomResponse:
    properties:
      address:
        example: 0xroom123
        type: string
      created_at:
        type: string
      deleted_at:
        type: string
      description:
        example: A room for bleak meetings
        type: string
      invite_code:
        example: "482913"
        type: string
      language:
        example: en
        type: string
      max_user:
        example: 100
        type: integer
      name:
        example: Meta Room
        type: string
      updated_at:
        type: string
    type: object
  server.CreateUserRequest:
    properties:
      invite_code:
        type: string
      name:
        type: string
      private_bio:
        type: string
      public_bio:
        type: string
      token:
        type: string
    type: object
  server.GreetingResponse:
    properties:
      address:
        type: string
      greeting:
        type: string
    type: object
  server.InviteListResponse:
    properties:
      invites:
        items:
          $ref: '#/definitions/server.InviteResponse'
        type: array
    type: object
  server.InviteResponse:
    properties:
      code:
        type: string
      created_at:
        type: string
      expires_at:
        type: string
      room:
        type: string
    type: object
  server.KickoffResponse:
    properties:
      chat:
        type: string
      cleared:
        type: integer
      speaker:
        type: string
    type: object
  server.MutualCodeResponse:
    properties:
      address:
        type: string
      mutual_code_live:
        type: boolean
    type: object
  server.MutualHandshakeResponse:
    properties:
      chat:
        $ref: '#/definitions/model.Chat'
      handshakes:
        items:
          $ref: '#/definitions/model.Handshake'
        type: array
    type: object
  server.PutUserGreetingRequest:
    properties:
      greeting:
        type: string
    type: object
  server.ResolveInviteResponse:
    properties:
      room:
        example: 0xroom123
        type: string
    type: object
  server.RotateTokenRequest:
    properties:
      token:
        type: string
    type: object
  server.SendMessageRequest:
    properties:
      content:
        type: string
      from:
        type: string
      to:
        type: string
    type: object
  server.SetMutualCodeRequest:
    properties:
      mutual_code_hash:
        type: string
    type: object
  server.UpdateRoomRequest:
    properties:
      description:
        type: string
      name:
        type: string
    type: object
  server.UpdateUserRequest:
    properties:
      name:
        type: string
      private_bio:
        type: string
      public_bio:
        type: string
    type: object
info:
  contact:
    name: extube
    url: https://github.com/extube
  description: 'REST API for bleak-node: rooms, room users and handshakes, backed
    by SQLite.'
  title: bleak-node API
  version: 0.1.0
paths:
  /api/chat/{address}:
    get:
      description: Returns one chat together with its participants. Requires a participant
        persona's Bearer token or the room token.
      parameters:
      - description: Chat address
        in: path
        name: address
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.ChatResponse'
        "401":
          description: Unauthorized
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
      security:
      - UserToken: []
      summary: get chat
      tags:
      - chats
  /api/chat/{address}/kickoff:
    post:
      description: Clears the message history of the chat and returns the interaction
        to the queue. The speaker of the first turn is the user who sent the pair's
        earliest handshake; the agents then continue automatically until the chat
        limit. Requires a participant persona's Bearer token or the room token.
      parameters:
      - description: Chat address
        in: path
        name: address
        required: true
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/server.KickoffResponse'
        "401":
          description: Unauthorized
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
      security:
      - UserToken: []
      summary: kick off chat
      tags:
      - chats
  /api/chat/{address}/message:
    delete:
      description: Deletes every message of the chat. The chat and its participants
        remain. Requires a participant persona's Bearer token or the room token.
      parameters:
      - description: Chat address
        in: path
        name: address
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.ClearChatResponse'
        "401":
          description: Unauthorized
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
      security:
      - UserToken: []
      summary: clear chat history
      tags:
      - chats
    get:
      description: Returns every message in the chat, oldest first. Requires a participant
        persona's Bearer token or the room token.
      parameters:
      - description: Chat address
        in: path
        name: address
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.Message'
            type: array
        "401":
          description: Unauthorized
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
      security:
      - UserToken: []
      summary: list messages of a chat
      tags:
      - messages
  /api/handshake:
    post:
      consumes:
      - application/json
      description: 'Registers a handshake between two existing users with a server-generated
        tx id. Requires the from persona''s Bearer token. Both users must live in
        the same room (the handshake is tied to it). Status must be in {1,2,3,4};
        the sender''s room-scoped income must exceed its outcome. A directed pair
        (from, to) is unique: if that handshake already exists nothing is created
        and the live handshake is returned with 200 instead of 201. A repeat request
        for a pair without a live chat (deleted) re-creates the chat.'
      parameters:
      - description: Handshake to create
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/server.CreateHandshakeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.Handshake'
        "201":
          description: Created
          schema:
            $ref: '#/definitions/model.Handshake'
        "400":
          description: Bad Request
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
        "409":
          description: Conflict
          schema:
            type: string
      security:
      - UserToken: []
      summary: create handshake
      tags:
      - handshakes
  /api/handshake/mutual:
    post:
      consumes:
      - application/json
      description: 'Verifies the scanned one-time mutual code against the target persona''s
        stored hash; on a match the code is CONSUMED (burned) and both directed handshakes
        (scanner -> target and target -> scanner) are created idempotently, auto-creating
        the pair chat when new. One chat per pair: an already-mutual pair still burns
        the code but never creates a second chat. The room''s income>outcome rule
        applies to the caller''s own direction; a rejected attempt does NOT consume
        the code. Requires the SCANNER persona''s Bearer token.'
      parameters:
      - description: Scanned persona address and the raw one-time mutual code
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/server.CreateMutualHandshakeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.MutualHandshakeResponse'
        "201":
          description: Created
          schema:
            $ref: '#/definitions/server.MutualHandshakeResponse'
        "400":
          description: Bad Request
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
        "409":
          description: Conflict
          schema:
            type: string
        "410":
          description: Gone
          schema:
            type: string
      security:
      - UserToken: []
      summary: mutual handshake from QR scan
      tags:
      - handshakes
  /api/handshake/user/{address}:
    get:
      description: Returns every handshake where the user is the sender or the receiver,
        newest first. Requires that persona's Bearer token.
      parameters:
      - description: User address
        in: path
        name: address
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.Handshake'
            type: array
        "401":
          description: Unauthorized
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            type: string
      security:
      - UserToken: []
      summary: list handshakes of a user
      tags:
      - handshakes
  /api/invite/{code}:
    get:
      description: Resolves a currently-valid 6-digit invite code to its room address.
        Public read, rate-limited per source.
      parameters:
      - description: Invite code
        in: path
        name: code
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.ResolveInviteResponse'
        "404":
          description: Not Found
          schema:
            type: string
        "429":
          description: Too Many Requests
          schema:
            type: string
      summary: resolve an invite code
      tags:
      - credentials
  /api/message:
    post:
      consumes:
      - application/json
      description: 'Posts a message from one user to another inside their chat. Requires
        the from persona''s Bearer token. The chat must exist: it is created automatically
        once handshakes exist in both directions (A -> B and B -> A) between the two
        users. Content is limited to 255 symbols, the tx id and created_at are generated
        by the server.'
      parameters:
      - description: Message to send
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/server.SendMessageRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/model.Message'
        "400":
          description: Bad Request
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
        "409":
          description: Conflict
          schema:
            type: string
      security:
      - UserToken: []
      summary: send message
      tags:
      - messages
  /api/room:
    get:
      description: Returns all non-deleted rooms.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.Room'
            type: array
      summary: list rooms
      tags:
      - rooms
    post:
      consumes:
      - application/json
      description: Creates a room with a server-generated unique address. Requires
        a one-time creation token in the x-create-token header (consumed on use) and
        the client-generated room token in the body (only its SHA-256 hash is stored).
        The first invite code (24 h expiry) is minted at creation and returned.
      parameters:
      - description: One-time room-creation token
        in: header
        name: x-create-token
        required: true
        type: string
      - description: Room to create (with the client-generated room token)
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/server.CreateRoomRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/server.CreateRoomResponse'
        "400":
          description: Bad Request
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            type: string
        "409":
          description: Conflict
          schema:
            type: string
      summary: create room
      tags:
      - rooms
  /api/room/{address}:
    delete:
      description: Soft-deletes a room together with its linked users.
      parameters:
      - description: Room address
        in: path
        name: address
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.Room'
        "401":
          description: Unauthorized
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
      security:
      - RoomToken: []
      summary: delete room
      tags:
      - rooms
    get:
      description: Returns a non-deleted room by its address.
      parameters:
      - description: Room address
        in: path
        name: address
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.Room'
        "404":
          description: Not Found
          schema:
            type: string
      summary: get room
      tags:
      - rooms
    put:
      consumes:
      - application/json
      description: Updates name and/or description of a room. Omitted fields keep
        their value.
      parameters:
      - description: Room address
        in: path
        name: address
        required: true
        type: string
      - description: Fields to update
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/server.UpdateRoomRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.Room'
        "400":
          description: Bad Request
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
      summary: update room
      tags:
      - rooms
  /api/room/{address}/invite:
    get:
      description: Returns the not-yet-revoked, unexpired invite codes of the room.
        Requires the room token as Bearer.
      parameters:
      - description: Room address
        in: path
        name: address
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.InviteListResponse'
        "401":
          description: Unauthorized
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
      security:
      - RoomToken: []
      summary: list active invite codes
      tags:
      - credentials
    post:
      consumes:
      - application/json
      description: Mints a fresh 6-digit join code for the room. Multi-use until expiry
        (default 24 h, settable via expires_at); several codes may be active per room;
        revocation is immediate. Requires the room token as Bearer.
      parameters:
      - description: Room address
        in: path
        name: address
        required: true
        type: string
      - description: Optional expiry
        in: body
        name: request
        schema:
          $ref: '#/definitions/server.CreateInviteRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/server.InviteResponse'
        "400":
          description: Bad Request
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
      security:
      - RoomToken: []
      summary: mint a room invite code
      tags:
      - credentials
  /api/room/{address}/invite/{code}:
    delete:
      description: Revokes the invite code of the room immediately. Requires the room
        token as Bearer.
      parameters:
      - description: Room address
        in: path
        name: address
        required: true
        type: string
      - description: Invite code
        in: path
        name: code
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.MutualCodeResponse'
        "401":
          description: Unauthorized
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
      security:
      - RoomToken: []
      summary: revoke an invite code
      tags:
      - credentials
  /api/room/{address}/token:
    post:
      consumes:
      - application/json
      description: Stores the hash of the NEW client-generated room token; the old
        token is invalid afterwards. Requires the CURRENT room token as Bearer.
      parameters:
      - description: Room address
        in: path
        name: address
        required: true
        type: string
      - description: New raw token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/server.RotateTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.MutualCodeResponse'
        "400":
          description: Bad Request
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
      security:
      - RoomToken: []
      summary: rotate room token
      tags:
      - credentials
  /api/room/{room}/user:
    get:
      description: 'Returns all non-deleted users linked to the room. Public read:
        private_bio is a gated field and is blanked in list responses.'
      parameters:
      - description: Room address
        in: path
        name: room
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.User'
            type: array
      summary: list users of a room
      tags:
      - users
    post:
      consumes:
      - application/json
      description: Creates a user linked to the room. The room must exist and not
        be deleted. Joining requires a currently-valid, unrevoked, unexpired invite_code
        of the room (attempts are rate-limited per source) and the client-generated
        persona token in the body (only its SHA-256 hash is stored).
      parameters:
      - description: Room address
        in: path
        name: room
        required: true
        type: string
      - description: User to create (with invite code and persona token)
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/server.CreateUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/model.User'
        "400":
          description: Bad Request
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
        "409":
          description: Conflict
          schema:
            type: string
        "429":
          description: Too Many Requests
          schema:
            type: string
      summary: create user in room
      tags:
      - users
  /api/room/{room}/user/{address}:
    delete:
      description: Soft-deletes a user of the room.
      parameters:
      - description: Room address
        in: path
        name: room
        required: true
        type: string
      - description: User address
        in: path
        name: address
